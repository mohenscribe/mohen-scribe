<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mohen Scribe</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #241b1c; background: #f7f2ed; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(720px, 100%); background: white; border: 1px solid #eaded7; border-radius: 24px; padding: 28px; box-shadow: 0 18px 50px rgba(71, 34, 38, .12); }
      h1 { margin: 0; color: #8b1e2d; }
      .tagline { color: #6c5b5e; margin: 8px 0 24px; }
      label { display: block; font-weight: 700; margin: 16px 0 6px; }
      input, textarea, button { width: 100%; font: inherit; }
      input, textarea { border: 1px solid #d8c9c3; border-radius: 12px; padding: 12px; }
      .check { display: flex; gap: 10px; align-items: center; font-weight: 600; }
      .check input { width: auto; }
      button { margin-top: 18px; border: 0; border-radius: 12px; padding: 13px; color: white; background: #8b1e2d; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 24px; color: #6c5b5e; }
      #result { margin-top: 20px; white-space: pre-wrap; line-height: 1.55; background: #fbf8f5; border-radius: 14px; padding: 16px; display: none; }
      .note { font-size: .88rem; color: #7c6b6d; }
    </style>
  </head>
  <body>
    <main>
      <h1>Mohen Scribe</h1>
      <p class="tagline">Audio and video to clean, editable text.</p>
      <form id="form">
        <label for="media">Audio or video</label>
        <input id="media" name="media" type="file" accept="audio/*,video/mp4,video/webm" required />
        <p class="note">Supported: MP3, MP4, MPEG, MPGA, M4A, WAV and WebM. Maximum 25 MB in this starter.</p>

        <label class="check"><input name="diarize" type="checkbox" value="true" /> Add speaker labels</label>

        <label for="language">Language code (optional)</label>
        <input id="language" name="language" maxlength="2" placeholder="en" />

        <label for="prompt">Names or difficult terms (optional)</label>
        <textarea id="prompt" name="prompt" rows="3" placeholder="Names, places and specialist words"></textarea>

        <button type="submit">Transcribe</button>
      </form>
      <p id="status"></p>
      <section id="result"></section>
    </main>
    <script>
      const form = document.querySelector("#form");
      const button = form.querySelector("button");
      const status = document.querySelector("#status");
      const result = document.querySelector("#result");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        status.textContent = "Transcribing…";
        result.style.display = "none";
        try {
          const response = await fetch("/api/transcribe", { method: "POST", body: new FormData(form) });
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || "Transcription failed.");
          result.textContent = data.segments?.length
            ? data.segments.map((item) => `${item.speaker}: ${item.text}`).join("\n\n")
            : data.text;
          result.style.display = "block";
          status.textContent = "Transcription complete.";
        } catch (error) {
          status.textContent = error.message || "Transcription failed.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
